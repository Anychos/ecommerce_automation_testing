name: Ecommerce Shop Test Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: test-automation-${{ github.ref }}
  cancel-in-progress: true

env:
  API_APP_REPOSITORY: ${{ vars.API_APP_REPOSITORY }}
  API_APP_REF: ${{ vars.API_APP_REF }}
  UI_APP_REPOSITORY: ${{ vars.UI_APP_REPOSITORY }}
  UI_APP_REF: ${{ vars.UI_APP_REF }}

jobs:

  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Установка зависимостей проекта
        run: pip install -r requirements.txt

      - name: Создание тестовой конфигурации
        run: cp .env.example .env

      - name: Запуск unit-тестов
        run: pytest tests/unit --alluredir=allure-results-unit --reruns 0

      - name: Upload unit Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-unit
          path: allure-results-unit

  api-tests:
    if: ${{ vars.API_APP_REPOSITORY != '' && vars.API_APP_REF != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Создание .env файла
        run: |
          cat <<EOF > .env
          # API
          HTTP_CLIENT__BASE_URL=http://localhost:8080
          HTTP_CLIENT__TIMEOUT=10
          SWAGGER_COVERAGE_SERVICES=[{"key":"online_shop_test_api","name":"Online Shop Test API","repository":"${API_APP_REPOSITORY}","swagger_url":"http://localhost:8080/openapi.json"}]
          ADMIN_DATA__EMAIL=test_admin@mail.ru
          ADMIN_DATA__PASSWORD=test_admin_password

          # UI
          BASE_URL=http://127.0.0.1:5000
          HEADLESS=true
          BROWSER=["chromium"]
          BROWSER_VIEWPORT={"width":1280,"height":720,"device_scale_factor":1}
          TEST_USER__EMAIL=test_user_1@example.com
          TEST_USER__NAME='Test User'
          TEST_USER__PHONE=71234567890
          TEST_USER__PASSWORD=test_password_123
          TEST_USER__CONFIRM_PASSWORD=test_password_123
          SESSION_BROWSER_STATE_FILE=session-browser-state.json
          FUNCTION_BROWSER_STATE_FILE=function-browser-state.json
          ALLURE_RESULTS_DIR=./allure-results
          EOF

      - uses: ./.github/actions/setup-backend

      - name: Запуск тестов API
        run: |
          pytest tests/api \
                 --alluredir=allure-results-api \
                 -n 3 \
                 --reruns 3 \
                 --reruns-delay 2

      - name: Upload API Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-api
          path: allure-results-api

  ui-tests:
    if: ${{ vars.API_APP_REPOSITORY != '' && vars.API_APP_REF != '' && vars.UI_APP_REPOSITORY != '' && vars.UI_APP_REF != '' }}
    runs-on: ubuntu-latest
    needs: api-tests
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Создание .env файла
        run: |
          cat <<EOF > .env
          # API
          HTTP_CLIENT__BASE_URL=http://localhost:8080
          HTTP_CLIENT__TIMEOUT=10
          SWAGGER_COVERAGE_SERVICES=[{"key":"online_shop_test_api","name":"Online Shop Test API","repository":"${API_APP_REPOSITORY}","swagger_url":"http://localhost:8080/openapi.json"}]
          ADMIN_DATA__EMAIL=test_admin@mail.ru
          ADMIN_DATA__PASSWORD=test_admin_password

          # UI
          BASE_URL=http://127.0.0.1:5000
          HEADLESS=true
          BROWSER=["chromium"]
          BROWSER_VIEWPORT={"width":1280,"height":720,"device_scale_factor":1}
          TEST_USER__EMAIL=test_user_1@example.com
          TEST_USER__NAME='Test User'
          TEST_USER__PHONE=71234567890
          TEST_USER__PASSWORD=test_password_123
          TEST_USER__CONFIRM_PASSWORD=test_password_123
          SESSION_BROWSER_STATE_FILE=session-browser-state.json
          FUNCTION_BROWSER_STATE_FILE=function-browser-state.json
          ALLURE_RESULTS_DIR=./allure-results
          EOF

      - uses: ./.github/actions/setup-backend

      - name: Установка Python и Playwright зависимостей
        run: |
          playwright install --with-deps chromium

      - name: Клонирование UI сервера
        run: |
          git clone "$UI_APP_REPOSITORY" practice_ui_test_server
          git -C practice_ui_test_server checkout --detach "$UI_APP_REF"

      - name: Создание окружения UI сервера
        run: |
          python -m venv .ui-venv
          .ui-venv/bin/python -m pip install -r practice_ui_test_server/requirements.txt

      - name: Запуск UI сервера
        env:
          API_BASE_URL: http://localhost:8080
          SECRET_KEY: secret-key
        run: |
          cd practice_ui_test_server
          ../.ui-venv/bin/python app.py &

      - name: Ожидание запуска UI сервера
        run: |
          for i in {1..30}; do
            curl -s http://127.0.0.1:5000 && exit 0
            sleep 2
          done
          exit 1

      - name: Запуск UI тестов
        run: |
          pytest tests/ui \
                 --alluredir=allure-results-ui \
                 -n 2 \
                 --reruns 3 \
                 --reruns-delay 2

      - name: Upload UI Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-ui
          path: allure-results-ui

  allure-report:
    runs-on: ubuntu-latest
    needs: [unit-tests, api-tests, ui-tests]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
        continue-on-error: true

      - name: Скачивание результатов API тестов
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-api
          path: api-results

      - name: Скачивание результатов unit-тестов
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-unit
          path: unit-results

      - name: Скачивание результатов UI тестов
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: allure-ui
          path: ui-results

      - name: Объединение результатов в одной директории
        run: |
          mkdir -p allure-results
          cp -r unit-results/* allure-results/ || true
          cp -r api-results/* allure-results/ || true
          cp -r ui-results/* allure-results/ || true

      - name: Копирование истории предыдущих запусков
        run: |
          if [ -d "gh-pages/latest/history" ]; then
            mkdir -p allure-results/history
            cp -r gh-pages/latest/history/* allure-results/history/
          fi

      - name: Генерация Allure отчета
        uses: simple-elf/allure-report-action@v1.13
        with:
          allure_results: allure-results
          allure_history: allure-history
          keep_reports: 5

      - name: Публикация Allure отчета
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages
          keep_files: false

  notify:
    runs-on: ubuntu-latest
    needs: [ allure-report ]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - name: Уведомление о статусе CI
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured; notification skipped."
            exit 0
          fi

          STATUS="${{ needs.allure-report.result }}"

          ALLURE_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"

          if [ "$STATUS" = "success" ]; then
            ICON="✅"
          else
            ICON="❌"
          fi

          MESSAGE=$(cat <<EOF
          $ICON CI: $STATUS
          
          Repository: ${{ github.repository }}
          Branch: ${{ github.ref_name }}
          
          Allure Report: $ALLURE_URL
          Run: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EOF
          )
          
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="$MESSAGE"
